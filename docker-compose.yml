services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: captable
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      DATABASE_URL: postgresql://postgres:postgres@db:5432/captable
      SECRET_KEY: compose-only-not-a-real-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENVIRONMENT: development
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:3000
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      COMPANY_NAME: TechStartup SAS
      COMPANY_AUTHORIZED_SHARES: "1000000"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: compose-only-not-a-real-password
      ADMIN_ROLE: admin
      ADMIN_NAME: Admin User
    ports:
      - "8000:8000"

  # docker compose --profile test run --rm tests
  # Runs the suite on the compose network, so it needs no port published on the host.
  tests:
    build: .
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://postgres:postgres@db:5432/captable_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/captable_test
    command: pytest -q

volumes:
  db-data:
