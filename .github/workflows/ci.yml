name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: captable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite runs against a real PostgreSQL, not a substitute: the schema
      # constraints are part of what is being tested.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/captable_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/captable_test
      SECRET_KEY: ci-only-not-a-real-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: test
      DEBUG: "false"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      COMPANY_NAME: CI Company
      COMPANY_AUTHORIZED_SHARES: "1000000"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-not-a-real-password
      ADMIN_ROLE: admin
      ADMIN_NAME: CI Admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries required by WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile the package
        run: python -m compileall -q app scripts

      - name: Run tests
        run: pytest -q
